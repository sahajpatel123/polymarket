# polymaker global config. Secrets live in .env, never here.
# See the README.
#
# DIRECTION (2026-07-24): scaled live market making.
# - Set risk.bankroll_usdc to your real pUSD balance — all caps scale.
# - Multi-category auto-discovery + advanced (AS+Kelly) quoting.
# - Paper first with the same bankroll; go live only after doctor + kill check.

[wallet]
# chain: Polygon mainnet
chain_id = 137
# signature_type — pick based on how your Polymarket account was created:
#   0 = EOA (funds held directly by your key; no proxy)
#   1 = email/magic proxy wallet
#   2 = older browser-wallet Gnosis Safe proxy
#   3 = POLY_1271 deposit wallet (the CURRENT architecture, ~June 2026+)
# If your UI shows a "deposit address", you almost certainly have a deposit
# wallet -> use 3. In every proxy case (1/2/3), BROWSER_ADDRESS is the DEPOSIT
# address (the funder that holds your pUSD), NOT your signing EOA and NOT the
# deployer/factory. Known SDK auth bugs live here (see the README) — `polymaker
# doctor` / `livetest` will tell you if you picked the wrong type.
signature_type = 3
clob_host = "https://clob.polymarket.com"
gamma_host = "https://gamma-api.polymarket.com"
data_api_host = "https://data-api.polymarket.com"
polygon_rpc = "https://polygon-bor-rpc.publicnode.com"

[engine]
debounce_ms = 250               # min gap between quote recomputes per market
quoter_tick_s = 60              # slow baseline refresh (reactions are event-driven); cool-off re-entry is precise
reconcile_interval_s = 20       # REST drift reconciliation cadence
catalog_refresh_s = 300         # market catalog rescan cadence
heartbeat = true                # exchange dead-man switch
heartbeat_interval_s = 5
journal = true                  # append raw WS/orders to journal/ for backtest
loop = "uvloop"                 # "uvloop" | "asyncio"
# ── auto market discovery (multi-category scaled live MM) ──
# Profitability gates in engine._run_discovery_pass keep junk out.
# Start paper with enabled=true; keep false for live until you trust the score.
auto_discovery_enabled = true
auto_discovery_interval_s = 1800.0
auto_discovery_tags = ["politics", "sports", "crypto", "news"]
# Profit-oriented gates: high score + real liquidity + meaningful reward pool
auto_discovery_min_score = 0.05
auto_discovery_min_liquidity = 15000.0
auto_discovery_min_daily_rate = 25.0   # skip dust pools; concentrate on dense rewards
auto_discovery_max_spread_cents = 5.5
# Concentrate: 2 high-density books beat 8 dust books for daily return %
auto_discovery_max_markets = 2
auto_discovery_profile = "live_scaled"
auto_discovery_hot_reload = true
# Live operator dashboard (opens in browser on `polymaker run` / `--paper`)
dashboard_enabled = true
dashboard_host = "127.0.0.1"
dashboard_port = 8765
dashboard_open_browser = true

[risk]
# ── SET THIS TO YOUR REAL BALANCE ──
# Caps DERIVED from bankroll × fractions when bankroll > 0.
bankroll_usdc = 100.0           # ← change me to actual pUSD
total_exposure_frac = 1.0
# Concentrate: max ~40% per market so 2–3 dense books can compound rewards
market_notional_frac = 0.40
event_group_frac = 0.50
daily_loss_frac = 0.10          # kill at −10% day (never weakened for return %)
market_loss_frac = 0.05
max_market_concentration_pct = 0.45
max_gas_cost_pct = 0.10
# Blind / dead-man thresholds (time-based, not capital-based)
ws_stale_halt_s = 10.0
user_ws_blind_halt_s = 15.0
heartbeat_halt_failures = 3
max_order_error_rate = 0.25
# Absolute fields below are ignored when bankroll_usdc > 0 (kept for docs /
# legacy tooling that still reads them). resolve_from_bankroll overwrites them.
max_total_exposure_usdc = 100.0
max_event_group_loss_usdc = 50.0
max_market_notional_usdc = 35.0
daily_loss_kill_usdc = 10.0
max_market_loss_usdc = 5.0

[execution]
rate_budget_fraction = 0.25     # fraction of documented API limits we allow
post_only = true                # every quote is post-only (maker-only mandate)
max_orders_per_batch = 15       # exchange batch cap

[paths]
db = "state.db"
journal_dir = "journal"
log_dir = "logs"
