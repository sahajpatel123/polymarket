# polymaker global config. Secrets live in .env, never here.
# See the README.

[wallet]
# chain: Polygon mainnet
chain_id = 137
# signature_type — pick based on how your Polymarket account was created:
#   0 = EOA (funds held directly by your key; no proxy)
#   1 = email/magic proxy wallet
#   2 = older browser-wallet Gnosis Safe proxy
#   3 = POLY_1271 deposit wallet (the CURRENT architecture, ~June 2026+)
# If your UI shows a "deposit address", you almost certainly have a deposit
# wallet -> use 3. In every proxy case (1/2/3), BROWSER_ADDRESS is the DEPOSIT
# address (the funder that holds your pUSD), NOT your signing EOA and NOT the
# deployer/factory. Known SDK auth bugs live here (see the README) — `polymaker
# doctor` / `livetest` will tell you if you picked the wrong type.
signature_type = 3
clob_host = "https://clob.polymarket.com"
gamma_host = "https://gamma-api.polymarket.com"
data_api_host = "https://data-api.polymarket.com"
polygon_rpc = "https://polygon-bor-rpc.publicnode.com"

[engine]
debounce_ms = 250               # min gap between quote recomputes per market
quoter_tick_s = 60              # slow baseline refresh (reactions are event-driven); cool-off re-entry is precise
reconcile_interval_s = 20       # REST drift reconciliation cadence
catalog_refresh_s = 300         # market catalog rescan cadence (15 min)
heartbeat = true                # exchange dead-man switch
heartbeat_interval_s = 5
journal = true                  # append raw WS/orders to journal/ for backtest
loop = "uvloop"                 # "uvloop" | "asyncio"
# ── auto market discovery (self-trading new markets) ──
# When enabled, the engine periodically re-scans Gamma for new markets across
# the configured tags, filters by score, and auto-adds them to the live trade
# list. The bot finds and trades new markets on its own — no manual
# `polymaker markets-add` needed.
# SAFETY: with 30 markets and $30 capital, each market gets $1 — below
# exchange minimum order size. Cap at 5 max, with strict profitability
# gates (see engine._run_discovery_pass).
auto_discovery_enabled = false          # OFF until you've validated in paper
auto_discovery_interval_s = 1800.0      # 30-min re-scan
auto_discovery_tags = ["politics"]       # single category until validated
auto_discovery_min_score = 0.02          # raised from 0.005 (filter junk)
auto_discovery_min_liquidity = 10000.0   # min liquidity per market
auto_discovery_min_daily_rate = 10.0     # min $10/day reward to auto-add
auto_discovery_max_spread_cents = 5.0    # max reward band width
auto_discovery_max_markets = 5           # 5 max (was 30 — too thin spread)
auto_discovery_profile = "aggressive_30"
auto_discovery_hot_reload = true

[risk]
max_total_exposure_usdc = 30.0      # $30 cap (was 450 — didn't fit a $30 account)
max_event_group_loss_usdc = 15.0    # 50% of capital
max_market_notional_usdc = 15.0     # 50% per market (was 400 — meaningless for $30)
daily_loss_kill_usdc = 3.0          # 10% of capital daily kill (was 40)
ws_stale_halt_s = 10.0
user_ws_blind_halt_s = 15.0
heartbeat_halt_failures = 3
max_order_error_rate = 0.25
max_market_concentration_pct = 0.5   # NEW: max 50% of capital in one market
max_market_loss_usdc = 2.0           # NEW: per-market loss kill at $2 (6.7%)
max_gas_cost_pct = 0.10              # NEW: stop if gas > 10% of capital

[execution]
rate_budget_fraction = 0.25     # fraction of documented API limits we allow
post_only = true                # every quote is post-only (maker-only mandate)
max_orders_per_batch = 15       # exchange batch cap

[paths]
db = "state.db"
journal_dir = "journal"
log_dir = "logs"
