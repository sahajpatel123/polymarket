# 4h paper validation config — $50 capital test (new S-tier architecture)
[wallet]
chain_id = 137
signature_type = 3
clob_host = "https://clob.polymarket.com"
gamma_host = "https://gamma-api.polymarket.com"
data_api_host = "https://data-api.polymarket.com"
polygon_rpc = "https://polygon-bor-rpc.publicnode.com"

[engine]
debounce_ms = 250
quoter_tick_s = 30
reconcile_interval_s = 15
catalog_refresh_s = 300
heartbeat = true
heartbeat_interval_s = 5
journal = true
loop = "uvloop"
# Auto-discovery: find + quote the best markets automatically.
# Set POLYMAKER_CAPITAL_USDC in .env to enable. Markets are selected by
# score (reward rate, liquidity, spread) and filtered by capital feasibility.
# When auto-discovery is on, markets.toml is the FIXED baseline; discovery
# ADDS complementary markets on top.
auto_discovery_enabled = true
auto_discovery_hot_reload = true
# Live dashboard on run (loopback). CLI: --no-dashboard / --no-open. URL → logs/dashboard.url
dashboard_enabled = true
dashboard_host = "127.0.0.1"
dashboard_port = 8765
dashboard_open_browser = true

[risk]
# Single capital knob — ALL caps derive from this. Change this number.
# At $50: ~$2.5/market, ~$25 daily loss kill, ~$12.5 max drawdown.
bankroll_usdc = 50.0
total_exposure_frac = 1.0
market_notional_frac = 0.40
event_group_frac = 0.50
daily_loss_frac = 0.10
market_loss_frac = 0.05
max_market_concentration_pct = 0.50
# Full deploy: 100% of bankroll is live. Market count scales with capital
# via recommend_max_markets(): $50 -> 2 x 50%, $1000 -> ~10 markets.
capital_deploy_frac = 1.0
# Soft-prefer markets ending within ~2 weeks when ranking portfolio.
prefer_horizon_days = 14.0
max_gas_cost_pct = 0.10
ws_stale_halt_s = 10.0
user_ws_blind_halt_s = 15.0
heartbeat_halt_failures = 3
max_order_error_rate = 0.25
# Absolutes filled by resolve_from_bankroll when bankroll > 0
max_total_exposure_usdc = 30.0
max_event_group_loss_usdc = 15.0
max_market_notional_usdc = 12.0
daily_loss_kill_usdc = 5.0
max_market_loss_usdc = 2.5


[execution]
rate_budget_fraction = 0.25
post_only = true
max_orders_per_batch = 15

[paths]
db = "livecfg/state.db"
journal_dir = "livecfg/journal"
log_dir = "livecfg/logs"
